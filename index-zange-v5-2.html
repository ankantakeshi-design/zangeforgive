<style>
:root{--black:#050308;--crimson:#8b0000;--gold:#c9a84c;--gold-dim:#7a6030;--ash:#3a3040;--smoke-c:#9a8fa8;--parchment:#d4c9a8;--light:#f0e8d0}

html,body{background:var(--black);color:var(--parchment);font-family:'Noto Serif JP','Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','YuMincho','MS Mincho',serif;min-height:100vh;font-size:16px}

.candle-wrap{position:relative;margin-bottom:40px}

const confessionsPT=["Honestamente, já faz três dias que não tomo banho.","Fico pensando em responder aquela mensagem... já faz duas semanas.","Houve uma época em que tentei sobreviver só com suplementos.","Comi algo duas semanas depois do prazo de validade.","Uma segunda-feira inspirada nunca chegou de verdade para mim.","Deixei a roupa na máquina por três dias.","Disse 'vou fazer já' e ainda não fiz.","Esqueci a carteira e voltei para pegar, e não contei para ninguém.","Fingi estar arrumando, mas na verdade estava escondendo coisas onde ninguém veria.","Hoje me disse 'amanhã está bom' de novo.","Continuei comendo mesmo sem estar com fome.","Virei o celular para baixo porque tinha medo de ver uma resposta.","Disse que tinha feito o dever de casa quando não tinha.","Só vivi de forma saudável no dia anterior ao exame médico.","Fingi estar dormindo no trem para não precisar ceder meu lugar.","Esqueci de dizer feliz aniversário por uma semana inteira.","Já faz cinco anos procurando aquele botão de motivação.","Estava exausto, mas continuei fingindo ser o animado.","Cobri tudo com maquiagem, mas estava cansado o tempo todo.","Li a mensagem, senti culpa, e não disse nada.","Às 2 da manhã, considerei seriamente simplesmente ir embora.","Há alguém que nunca consegui agradecer.","Chorei, e não contei para ninguém.","Estou me esforçando muito porque quero que alguém diga 'você está indo muito bem'.","Disse que estava bem, mas realmente precisava de ajuda.","As pessoas me chamam de dedicado, mas sempre escondi meu verdadeiro eu.","Ainda não consegui superar meu primeiro amor.","Na superfície pareço realista, mas ainda penso no sonho que abandonei.","Disse 'que incrível' mas secretamente estava com inveja.","Mesmo quando estava rindo, uma parte de mim estava chorando.","Escondo o quanto rapidamente quero fugir das coisas.","Não consigo parar de me comparar com todos que vejo.","Sempre segui os outros só para não ser odiado.","Agi como se não estivesse magoado, mas estava, profundamente.","Sorrio o tempo todo, mas nunca consegui contar para ninguém o quão solitário estou.","Ajo como se não precisasse de amor, mas sempre quis mais.","Fingi não estar com raiva. Estava com raiva.","Sorri quando estava triste. Não conseguia dizer que estava triste.","Comi comida que odiava e fingi que estava tudo bem.","Continuo repassando a noite em que falhei, repetidamente.","Quando alguém pergunta se estou bem, digo 'totalmente bem!' toda vez.","Achei que conseguia continuar, mas atingi meu limite primeiro.","Estou cansado de fingir ser um adulto adequado. Realmente não sou.","Já quis jogar tudo fora mais vezes do que consigo contar.","Sei que posso descansar, mas não consigo.","Algo que alguém disse anos atrás ainda vive na minha cabeça.","Digo que não quero arrependimentos, mas aqui estou, cheio deles.","Finjo entender, mas realmente só queria reclamar mais.","Escondi meu lado bagunçado e fingi na frente de todos.","Quando disse 'não é nada', sempre era alguma coisa.","Não conseguia ser honesto, então continuava dizendo não se preocupe comigo.","Queria pedir desculpas, mas o tempo passou e nunca o fiz.","Havia palavras que pretendia dizer. Nunca as disse.","Quando alguém é gentil comigo, fico com medo e afasto essa pessoa.","'Tanto faz.' 'Tudo bem.' 'Não é nada.' Só queria ser honesto.","Fingi gostar de alguém que não gostava.","Mesmo em grupo, me sentia completamente sozinho.","Fiquei animado para ninguém se preocupar comigo.","Sabia que havia magoado alguém e agi como se não soubesse.","Houve noites em que só queria ficar sozinho e em silêncio."];

const confessionsES=["Honestamente, ya van tres días sin bañarme.","Sigo pensando en responder ese mensaje... ya van dos semanas.","Hubo una época en que intenté sobrevivir solo con suplementos.","Comí algo dos semanas después de su fecha de vencimiento.","Un lunes inspirado nunca ha llegado de verdad para mí.","Dejé la ropa en la lavadora durante tres días.","Dije 'lo haré ahora mismo' y todavía no lo he hecho.","Olvidé mi billetera y regresé a buscarla, y no se lo dije a nadie.","Fingí estar ordenando, pero en realidad estaba escondiendo cosas donde nadie las vería.","Hoy me dije 'mañana está bien' otra vez.","Seguí comiendo aunque ya no tenía hambre.","Puse el teléfono boca abajo porque tenía miedo de ver una respuesta.","Dije que había hecho la tarea cuando no era así.","Solo viví de forma saludable el día anterior al chequeo médico.","Fingí estar dormido en el tren para no tener que ceder mi asiento.","Me olvidé de decir feliz cumpleaños durante toda una semana.","Ya van cinco años buscando ese botón de motivación.","Estaba agotado, pero seguí haciendo el papel del animado.","Lo cubrí todo con maquillaje, pero estaba cansado todo el tiempo.","Leí el mensaje, sentí culpa, y no dije nada.","A las 2 de la madrugada, consideré seriamente simplemente irme.","Hay alguien a quien nunca pude agradecer.","Lloré, y no se lo conté a nadie.","Me estoy esforzando mucho porque quiero que alguien diga 'lo estás haciendo muy bien'.","Dije que estaba bien, pero realmente necesitaba ayuda.","La gente me llama dedicado, pero siempre he ocultado mi verdadero yo.","Todavía no he podido superar mi primer amor.","En la superficie parezco realista, pero aún pienso en el sueño que abandoné.","Dije 'qué increíble' pero en secreto tenía envidia.","Incluso cuando reía, una parte de mí estaba llorando.","Escondo lo rápido que quiero huir de las cosas.","No puedo dejar de compararme con todos los que veo.","Siempre he seguido a los demás solo para no ser odiado.","Actué como si no estuviera sch, aber ich denke noch immer an den Traum, den ich aufgegeben habe.","Ich sagte 'wow, toll' aber war heimlich neidisch.","Auch wenn ich lachte, weinte ein Teil von mir.","Ich verberge, wie schnell ich vor den Dingen fliehen will.","Ich kann nicht aufhören, mich mit allen zu vergleichen.","Ich habe mich immer anderen angepasst, nur um nicht unbeliebt zu sein.","Ich tat so, als wäre ich nicht verletzt, aber ich war es – tief im Inneren.","Ich lächle immer, konnte aber niemandem sagen, wie einsam ich bin.","Ich tue so, als bräuchte ich keine Liebe, aber ich habe mir immer mehr davon gewünscht.","Ich tat so, als wäre ich nicht wütend. Ich war wütend.","Ich habe gelächelt, als ich traurig war. Ich konnte nicht sagen, dass ich traurig bin.","Ich habe Essen gegessen, das ich hasste, und getan, als wäre es in Ordnung.","Ich durchlebe immer wieder die Nacht, in der ich versagt habe.","Wenn jemand fragt, ob es mir gut geht, sage ich jedes Mal 'ja, super!'.","Ich dachte, ich könnte weitermachen, aber ich erreichte zuerst meine Grenze.","Ich bin es leid, einen ordentlichen Erwachsenen zu spielen. Das bin ich wirklich nicht.","Ich wollte alles hinwerfen, öfter als ich zählen kann.","Ich weiß, dass ich mich ausruhen darf, aber ich kann es nicht.","Etwas, das jemand vor Jahren gesagt hat, lebt noch immer in meinem Kopf.","Ich sage, ich will keine Reue haben, und doch stecke ich voller Reue.","Ich tue so, als würde ich verstehen, wollte aber eigentlich nur mehr klagen.","Ich habe meine unordentliche Seite versteckt und vor allen eine Fassade aufrechterhalten.","Als ich sagte 'es ist nichts', war es immer etwas.","Ich konnte nicht ehrlich sein, also sagte ich immer wieder: mach dir keine Sorgen um mich.","Ich wollte mich entschuldigen, aber die Zeit verging und ich tat es nie.","Es gab Worte, die ich sagen wollte. Ich habe sie nie gesagt.","Wenn jemand nett zu mir ist, werde ich ängstlich und dränge ihn weg.","'Egal.' 'Schon gut.' 'Ist nichts.' Ich wollte einfach ehrlich sein.","I function applyLang(){
  const d=t();
  document.documentElement.lang=d.lang;
  document.documentElement.dir=d.dir||'ltr';
  document.title=d.title;
  document.querySelector('.site-sub').textContent=d.sub;
  document.querySelector('.write-label').textContent=d.writeLabel;
  writeBox.placeholder=d.placeholder;
  document.getElementById('purifyBtn').textContent=d.purifyBtn;
  document.getElementById('charHint').textContent=d.charHint;
  document.querySelector('.hint-label').textContent=d.hintLabel;
  const isOpen=hintBox.classList.contains('open');
  hintToggleBtn.textContent=isOpen?d.hintClose:d.hintToggle;
  document.getElementById('shuffleBtn').textContent=d.shuffleBtn;
  document.querySelector('#snsSection .section-label').textContent=d.snsLabel;
  document.getElementById('copyBtn').textContent=d.copyBtn;
  document.getElementById('shareX').textContent=d.shareX;
  document.getElementById('shareThreads').textContent=d.shareThreads;
  document.getElementById('shareLine').textContent=d.shareLine;
  document.getElementById('resetBtn').textContent=d.resetBtn;
  document.getElementById('ritualBackBtn').textContent=d.backBtn;
  document.getElementById('copyFeedback').textContent=d.copyFeedback;
  document.getElementById('msg1').textContent=d.msg1;
  document.getElementById('msg2').textContent=d.msg2;
  document.getElementById('msg3').textContent=d.msg3;
  document.getElementById('msg4').textContent=d.msg4;
  document.getElementById('msg5').textContent=d.msg5;
  if(isOpen&&hintBox.dataset.loaded){currentIdx=-1;pickConfession(false);}
  // Instagram: hide only where blocked (China, Iran)
  const instaBtn=document.getElementById('instaBtn');
  if(instaBtn){instaBtn.style.display=new Set(['cn','fa','ru']).has(currentLang)?'none':'';}
}

document.getElementById('langSelect').addEventListener('change',function(){
  currentLang=this.value;
  currentIdx=-1;
  applyLang();
  updateGaugeUI(gaugeCount);
});

function pickConfession(animated){
  const list=t().confessions;
  let idx;
  do{idx=Math.floor(Math.random()*list.length);}while(idx===currentIdx);
  currentIdx=idx;
  const el=document.getElementById('themeText');
  if(animated){el.style.opacity='0';setTimeout(()=>{el.textContent=list[idx];el.style.opacity='1';},300);}
  else{el.textContent=list[idx];}
}

hintToggleBtn.addEventListener('click',()=>{
  const isOpen=hintBox.classList.toggle('open');
  hintToggleBtn.textContent=isOpen?t().hintClose:t().hintToggle;
  if(isOpen&&!hintBox.dataset.loaded){pickConfession(false);hintBox.dataset.loaded='1';}
});
document.getElementById('shuffleBtn').addEventListener('click',()=>pickConfession(true));
writeBox.addEventListener('input',()=>{writeBox.style.height='auto';writeBox.style.height=writeBox.scrollHeight+'px';});

const canvas=document.getElementById('smokeCanvas');
const ctx=canvas.getContext('2d');
let particles=[],rafId=null,isRunning=false;
function addParticle(){particles.push({x:80+(Math.random()-.5)*4,y:170,vx:(Math.random()-.5)*.6,vy:-(1.0+Math.random()*1.0),r:3+Math.random()*4,life:1,decay:.005+Math.random()*.003,angle:Math.random()*Math.PI*2,angleSpeed:(Math.random()-.5)*.05});}
function drawFrame(){ctx.clearRect(0,0,160,180);if(isRunning&&Math.random()<.3)addParticle();particles=particles.filter(p=>p.life>0);for(const p of particles){p.angle+=p.angleSpeed;p.x+=p.vx+Math.sin(p.angle)*.5;p.y+=p.vy;p.r+=.12;p.life-=p.decay;const a=Math.max(0,p.life)*.4;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(210,200,225,${a})`);g.addColorStop(.6,`rgba(160,150,180,${a*.4})`);g.addColorStop(1,`rgba(80,70,100,0)`);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}if(particles.length>0||isRunning){rafId=requestAnimationFrame(drawFrame);}else{rafId=null;}}
function startSmoke(){isRunning=true;particles=[];if(!rafId)drawFrame();}
function stopSmoke(){isRunning=false;}

document.getElementById('purifyBtn').addEventListener('click',()=>{
  const text=writeBox.value.trim();
  beginPurification(text);
});

function beginPurification(confText){
  // 浄化のたびにゲージを加算
  if(gaugeCount<MAX_GAUGE){
    gaugeCount=Math.min(gaugeCount+1,MAX_GAUGE);
    saveGauge(gaugeCount);
    updateGaugeUI(gaugeCount);
  }
  window.scrollTo({top:0,behavior:'smooth'});
  setupSNS(confText);
  setTimeout(()=>{
    const overlay=document.getElementById('ritualOverlay');
    ['msg1','msg2','msg3','msg4','msg5'].forEach(id=>document.getElementById(id).classList.remove('show'));
    overlay.classList.add('active');
    const ember=overlay.querySelector('[style*="emberdie"]');
    if(ember){ember.style.animation='none';void ember.offsetWidth;ember.style.animation='';}
    startSmoke();
    [1400,2200,3200,4400,5400].forEach((ms,i)=>{
      setTimeout(()=>document.getElementById('msg'+(i+1)).classList.add('show'),ms);
    });
  },1800);
}

document.getElementById('ritualBackBtn').addEventListener('click',(e)=>{
  e.stopPropagation();
  const overlay=document.getElementById('ritualOverlay');
  const sns=document.getElementById('snsSection');
  stopSmoke();
  overlay.classList.remove('active');
  sns.classList.add('visible');
  setTimeout(()=>{window.scrollTo({top:document.getElementById('snsSection').offsetTop-20,behavior:'smooth'});},750);
});

function setupSNS(text){
  const snsText=`${t().snsPrefix}\n${text?text+'\n':''}\n${t().snsHashtag}`;
  document.getElementById('snsPreview').textContent=snsText;
  const enc=encodeURIComponent(snsText);
  const siteUrl=encodeURIComponent('https://zangeforgive.pages.dev/');

  // X (Twitter) — banned: cn(China), fa(Iran), ru(Russia)
  const xBanned=new Set(['cn','fa','ru']);
  const xBtn=document.getElementById('shareX');
  if(xBanned.has(currentLang)){
    xBtn.style.display='none';
  } else {
    xBtn.style.display='';
    xBtn.href=`https://twitter.com/intent/tweet?text=${enc}`;
  }

  // Threads — banned: cn(China), fa(Iran), ru(Russia)
  const threadsBanned=new Set(['cn','fa','ru']);
  const threadsBtn=document.getElementById('shareThreads');
  if(threadsBanned.has(currentLang)){
    threadsBtn.style.display='none';
  } else {
    threadsBtn.style.display='';
    threadsBtn.href=`https://www.threads.net/intent/post?text=${enc}`;
  }

  // 3rd share button: 地域の主要メッセージアプリ
  const lineEl=document.getElementById('shareLine');
  lineEl.style.display='';
  if(currentLang==='ru'){
    // ロシア: VKontakte
    lineEl.href=`https://vk.com/share.php?url=${siteUrl}&title=${enc}`;
  } else if(currentLang==='cn'){
    // 中国: 微博(Weibo)
    lineEl.href=`https://service.weibo.com/share/share.php?url=${siteUrl}&title=${enc}`;
  } else if(currentLang==='fa'){
    // イラン: Telegram
    lineEl.href=`https://t.me/share/url?url=${siteUrl}&text=${enc}`;
  } else if(currentLang==='ko'){
    // 韓国: KakaoTalk
    lineEl.href=`https://story.kakao.com/share?url=${siteUrl}`;
  } else if(currentLang==='vi'){
    // ベトナム: Zalo (国民的アプリ)
    lineEl.href=`https://zalo.me/share?url=${siteUrl}&text=${enc}`;
  } else if(currentLang==='ar'){
    // アラブ圏: WhatsApp (最大シェア)
    lineEl.href=`https://wa.me/?text=${enc}`;
  } else if(['ja','zh','th','cn'].includes(currentLang)){
    // 日本・台湾・タイ: LINE
    lineEl.href=`https://line.me/R/msg/text/?${enc}`;
  } else {
    // その他(en,id,pt,es,de,it,hi,tl,tr,fr): WhatsApp
    lineEl.href=`https://wa.me/?text=${enc}`;
  }

}

const MAX_GAUGE=9999;
const STORAGE_KEY='zange_gauge_v1';

function loadGauge(){
  try{const v=localStorage.getItem(STORAGE_KEY);return v?parseInt(v,10):0;}
  catch(e){return 0;}
}
function saveGauge(n){
  try{localStorage.setItem(STORAGE_KEY,String(n));}catch(e){}
}

function getRank(n){
  for(let i=GAUGE_RANKS.length-1;i>=0;i--){
    if(n>=GAUGE_RANKS[i].min)return GAUGE_RANKS[i];
  }
  return GAUGE_RANKS[0];
}

function getRankLabel(rank){
  const lang=currentLang;
  return rank[lang]||rank['en']||rank['ja'];
}

function getGaugeI18n(){
  return GAUGE_I18N[currentLang]||GAUGE_I18N['en'];
}

function getBarPercent(n){
  const rank=getRank(n);
  if(n>=MAX_GAUGE)return 100;
  const range=rank.max-rank.min+1;
  const pos=n-rank.min;
  return Math.min(100,Math.round((pos/range)*100));
}

function updateGaugeUI(n){
  const padded=String(Math.min(n,MAX_GAUGE)).padStart(4,'0');
  document.getElementById('gaugeCount').textContent=padded;
  const rank=getRank(n);
  const label=getRankLabel(rank);
  const rankEl=document.getElementById('rankLabel');
  rankEl.textContent=label;
  rankEl.className='rank-label'+(n>=MAX_GAUGE?' god':'');
  document.getElementById('gaugeBarFill').style.width=getBarPercent(n)+'%';
  const gi=getGaugeI18n();
  document.getElementById('gaugeHeading').textContent=gi.heading;
  document.getElementById('rankHeading').textContent=gi.rankHeading;
  const tenseiBtn=document.getElementById('tenseiBtn');
  tenseiBtn.textContent=gi.tenseiBtn;
  tenseiBtn.classList.toggle('visible',n>=MAX_GAUGE);
  document.getElementById('tenseiModalTitle').textContent=gi.modalTitle;
  document.getElementById('tenseiModalBody').innerHTML=gi.modalBody;
  document.getElementById('tenseiYesBtn').textContent=gi.yes;
  document.getElementById('tenseiNoBtn').textContent=gi.no;
}

let gaugeCount=loadGauge();
updateGaugeUI(gaugeCount);

// 転生ボタン
document.getElementById('tenseiBtn').addEventListener('click',(e)=>{
  e.stopPropagation();
  document.getElementById('tenseiModalBg').classList.add('open');
});

// モーダル背景タップ → NO
document.getElementById('tenseiModalBg').addEventListener('click',(e)=>{
  if(e.target===document.getElementById('tenseiModalBg')){
    document.getElementById('tenseiModalBg').classList.remove('open');
  }
});

document.getElementById('tenseiNoBtn').addEventListener('click',()=>{
  document.getElementById('tenseiModalBg').classList.remove('open');
});

document.getElementById('tenseiYesBtn').addEventListener('click',()=>{
  gaugeCount=0;
  saveGauge(0);
  updateGaugeUI(0);
  document.getElementById('tenseiModalBg').classList.remove('open');
});
