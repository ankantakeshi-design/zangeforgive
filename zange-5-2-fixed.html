<style>
:root{--black:#050308;--crimson:#8b0000;--gold:#c9a84c;--gold-dim:#7a6030;--ash:#3a3040;--smoke-c:#9a8fa8;--parchment:#d4c9a8;--light:#f0e8d0}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;font-size:16px}
html,body{background:var(--black);color:var(--parchment);font-family:'Noto Serif JP','Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','YuMincho','MS Mincho',serif;min-height:100vh;font-size:16px}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite var(--del,0s);opacity:0}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:var(--op,.6)}}
.ritual-bg{position:fixed;inset:0;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center;opacity:.04}
.ritual-bg svg{width:min(80vw,80vh);height:min(80vw,80vh);animation:slowspin 120s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.container{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:60px 24px 120px;display:flex;flex-direction:column;align-items:center}
.site-header{text-align:center;margin-bottom:48px}
.site-title{font-family:'Cinzel Decorative','Times New Roman',serif;font-size:clamp(3rem,12vw,6rem);font-weight:700;letter-spacing:.15em;color:transparent;background:linear-gradient(180deg,#e8d5a0 0%,#c9a84c 40%,#7a5c20 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 30px rgba(201,168,76,.4));line-height:1;margin-bottom:8px}
.site-sub{font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:15px;color:var(--smoke-c);letter-spacing:.3em}
.divider{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:20px auto 0}
.candle-wrap{position:relative;margin-bottom:40px}
.candle-container{display:flex;flex-direction:column;align-items:center}
.flame-wrap{position:relative;width:40px;height:70px;display:flex;justify-content:center;align-items:flex-end}
.flame-outer{position:absolute;bottom:0;width:28px;height:55px;background:radial-gradient(ellipse at 50% 80%,#fff 0%,#ffe566 20%,#ff9500 50%,#e85d04 75%,transparent 100%);border-radius:50% 50% 30% 30%;animation:flicker 2s ease-in-out infinite alternate,sway 3s ease-in-out infinite;filter:blur(1px);transform-origin:bottom center}
.flame-inner{position:absolute;bottom:4px;width:14px;height:28px;background:radial-gradient(ellipse at 50% 70%,#fff 0%,#fffde0 40%,#ffe566 80%,transparent 100%);border-radius:50% 50% 30% 30%;animation:flicker 1.5s ease-in-out infinite alternate-reverse,sway 3s ease-in-out infinite;filter:blur(.5px);transform-origin:bottom center}
@keyframes flicker{0%{transform:scaleY(1) scaleX(1);opacity:1}30%{transform:scaleY(.95) scaleX(1.05)}60%{transform:scaleY(1.05) scaleX(.95);opacity:.95}100%{transform:scaleY(.9) scaleX(1.08);opacity:.9}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.flame-glow{position:absolute;bottom:-10px;width:80px;height:80px;background:radial-gradient(circle,rgba(232,93,4,.3) 0%,transparent 70%);border-radius:50%;animation:glowpulse 2s ease-in-out infinite alternate}
@keyframes glowpulse{from{opacity:.5;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
.candle-body{width:32px;height:120px;background:linear-gradient(90deg,#f8f0e0 0%,#fffdf5 30%,#e8dcc8 70%,#c8bca8 100%);border-radius:4px 4px 6px 6px;box-shadow:inset -4px 0 8px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.5)}
.candle-stand{width:60px;height:8px;background:linear-gradient(180deg,#2a2020,#1a1010);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.8);margin-top:2px}
.candle-light{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:200px;height:60px;background:radial-gradient(ellipse,rgba(201,168,76,.15) 0%,transparent 70%);animation:glowpulse 2s ease-in-out infinite alternate;pointer-events:none}
.purify-btn{width:100%;background:linear-gradient(135deg,#1a0a0a,#2d0d0d);border:1px solid var(--crimson);color:var(--parchment);font-family:'Cinzel Decorative','Times New Roman',serif;font-size:1.1rem;letter-spacing:.2em;padding:18px 32px;cursor:pointer;transition:all .4s;position:relative;overflow:hidden;border-radius:2px;margin-bottom:12px}
.purify-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(139,0,0,.2));opacity:0;transition:opacity .3s}
.purify-btn:hover::before{opacity:1}
.purify-btn:hover{border-color:#cc0000;box-shadow:0 0 30px rgba(139,0,0,.4),inset 0 0 20px rgba(139,0,0,.1);transform:translateY(-1px)}
.purify-btn:active{transform:translateY(1px)}
.section-label{font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:13px;letter-spacing:.3em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:12px;text-align:center}
.write-label{align-self:center}
.write-box{width:100%;background:rgba(5,3,8,.8);border:1px solid rgba(201,168,76,.15);border-radius:2px;padding:20px;color:var(--parchment);font-family:'Noto Serif JP',serif;font-size:15px;line-height:1.8;resize:none;min-height:220px;overflow:hidden;outline:none;transition:border-color .3s,box-shadow .3s;margin-bottom:8px}
.write-box::placeholder{color:rgba(154,143,168,.4);font-style:italic}
.write-box:focus{border-color:rgba(201,168,76,.35);box-shadow:0 0 20px rgba(139,0,0,.15),inset 0 0 10px rgba(0,0,0,.3)}
.char-hint{text-align:center;font-size:12px;color:var(--smoke-c);margin-bottom:24px;font-style:italic}
.hint-toggle-wrap{width:100%;margin-top:20px;margin-bottom:0}
.hint-label{font-family:'Noto Serif JP',serif;font-size:15px;color:var(--gold-dim);letter-spacing:.1em;text-align:center;margin-bottom:10px}
.hint-toggle-btn{display:block;margin:0 auto;background:rgba(154,143,168,.08);border:1px solid rgba(154,143,168,.3);color:var(--smoke-c);font-family:'Noto Serif JP',serif;font-size:14px;padding:10px 28px;cursor:pointer;letter-spacing:.1em;transition:all .3s;border-radius:2px;text-align:center}
.hint-toggle-btn:hover{border-color:rgba(201,168,76,.35);color:var(--parchment);background:rgba(154,143,168,.15)}
.confession-box{width:100%;background:linear-gradient(135deg,rgba(10,6,16,.95),rgba(20,12,30,.95));border:1px solid rgba(201,168,76,.2);border-radius:2px;padding:24px 28px;position:relative;box-shadow:0 0 40px rgba(139,0,0,.1),inset 0 0 30px rgba(0,0,0,.5)}
.confession-box::before,.confession-box::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--gold-dim);border-style:solid}
.confession-box::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.confession-box::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.hint-box{display:none;margin-top:12px}
.hint-box.open{display:block}
.today-theme{font-size:1.1rem;color:var(--light);line-height:1.7;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
.shuffle-btn{display:block;margin:16px auto 0;background:none;border:1px solid rgba(201,168,76,.3);color:var(--gold-dim);font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:14px;letter-spacing:.15em;padding:8px 20px;cursor:pointer;transition:all .3s;border-radius:1px}
.shuffle-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.05)}
.sns-section{width:100%;background:linear-gradient(135deg,rgba(10,6,16,.95),rgba(20,12,30,.95));border:1px solid rgba(201,168,76,.15);border-radius:2px;padding:24px;margin-top:32px;display:none}
.sns-section.visible{display:block}
.sns-text-preview{background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,.1);border-radius:2px;padding:16px;font-size:14px;color:var(--smoke-c);line-height:1.7;margin-bottom:16px;white-space:pre-wrap;word-break:break-all}
.copy-btn{width:100%;background:none;border:1px solid rgba(201,168,76,.3);color:var(--gold);font-family:'Noto Serif JP',serif;font-size:14px;padding:12px;cursor:pointer;letter-spacing:.1em;transition:all .3s;margin-bottom:12px;border-radius:1px}
.copy-btn:hover{background:rgba(201,168,76,.08);border-color:var(--gold)}
.share-buttons{display:flex;gap:8px;flex-wrap:wrap}
.share-btn{flex:1;min-width:80px;padding:10px 8px;border:1px solid;border-radius:1px;font-size:13px;font-family:'Noto Serif JP',serif;cursor:pointer;transition:all .3s;text-align:center;text-decoration:none;display:block;letter-spacing:.05em}
.share-x{border-color:rgba(255,255,255,.2);color:#e0e0e0;background:rgba(0,0,0,.3)}
.share-x:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.4)}
.share-threads{border-color:rgba(255,255,255,.15);color:#c0c0c0;background:rgba(0,0,0,.3)}
.share-threads:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3)}
.share-line{border-color:rgba(0,180,0,.3);color:#7de07d;background:rgba(0,0,0,.3)}
.share-line:hover{background:rgba(0,180,0,.05);border-color:rgba(0,180,0,.5)}
.reset-btn{margin:32px auto 0;background:none;border:none;color:var(--smoke-c);font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:13px;letter-spacing:.2em;cursor:pointer;transition:color .3s;text-decoration:underline;text-underline-offset:4px;display:block}
.reset-btn:hover{color:var(--smoke-c)}
.ritual-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,1,5,.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:45vh;padding-left:24px;padding-right:24px;padding-bottom:100px;text-align:center;cursor:default;overflow-y:auto;visibility:hidden;opacity:0;transition:opacity .7s ease,visibility 0s linear .7s}
.ritual-overlay.active{visibility:visible;opacity:1;transition:opacity .7s ease,visibility 0s linear 0s}
.ritual-candle-wrap{position:relative;margin-bottom:48px}
#smokeCanvas{position:absolute;top:-150px;left:50%;transform:translateX(-50%);pointer-events:none}
.ritual-messages{display:flex;flex-direction:column;gap:20px;max-width:480px}
.ritual-msg{opacity:0;transform:translateY(15px);transition:opacity 1.2s ease,transform 1.2s ease;line-height:1.9}
.ritual-msg.show{opacity:1;transform:translateY(0)}
.ritual-msg.main{font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:clamp(1.3rem,5vw,1.8rem);color:var(--gold)}
.ritual-msg.sub{font-size:15px;color:var(--smoke-c);letter-spacing:.05em}
.ritual-hint{position:fixed;bottom:0;left:0;right:0;z-index:1100;background:rgba(139,0,0,0.18);border:none;border-top:1px solid rgba(201,168,76,0.25);color:var(--parchment);font-family:'Noto Serif JP',serif;font-size:15px;letter-spacing:.15em;padding:20px 24px;cursor:pointer;animation:fadein 2s 5s both;opacity:0;text-align:center;backdrop-filter:blur(4px);transition:background .3s,color .3s;width:100%}.ritual-hint:hover{background:rgba(139,0,0,0.4);color:var(--gold)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.copy-feedback{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold);padding:10px 24px;font-family:'IM Fell English','Georgia','Times New Roman',serif;font-style:italic;font-size:14px;border-radius:2px;opacity:0;transition:all .3s;pointer-events:none;z-index:2000}
.copy-feedback.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes emberdie{0%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(0)}}
.insta-section{width:100%;text-align:center;margin-top:28px}
.insta-label{font-family:'IM Fell English',serif;font-style:italic;font-size:.75rem;letter-spacing:.3em;color:var(--gold-dim);margin-bottom:12px}
.insta-btn{display:inline-flex;align-items:center;gap:10px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.25);border-radius:2px;padding:12px 26px;color:var(--smoke-c);font-family:'Noto Serif JP',serif;font-size:.82rem;letter-spacing:.1em;cursor:pointer;text-decoration:none;transition:all .3s}
.insta-btn:hover{border-color:rgba(201,168,76,.5);color:var(--parchment);background:rgba(201,168,76,.15)}
.insta-btn svg{width:16px;height:16px;fill:var(--smoke-c);flex-shrink:0;transition:fill .3s}
.insta-btn:hover svg{fill:var(--parchment)}
.copyright{position:fixed;bottom:12px;right:16px;z-index:500;font-family:'IM Fell English',serif;font-style:italic;font-size:.72rem;color:rgba(154,143,168,.5);letter-spacing:.08em;pointer-events:none;user-select:none}
@media(max-width:480px){.container{padding:40px 16px 80px}.confession-box{padding:18px 16px}}
</style>
</head>

<div class="ritual-overlay" id="ritualOverlay">
  <div class="ritual-candle-wrap">
    <canvas id="smokeCanvas" width="160" height="180"></canvas>
    <div class="candle-container">
      <div style="width:40px;height:70px;display:flex;justify-content:center;align-items:flex-end;position:relative;">
        <div style="width:2px;height:14px;background:linear-gradient(180deg,#555,#1a1a1a);border-radius:1px;margin-bottom:0;"></div>
        <div style="position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,rgba(200,80,0,0.6) 0%,transparent 100%);animation:emberdie 3s ease-out forwards;"></div>
      </div>
      <div class="candle-body"></div>
      <div class="candle-stand"></div>
    </div>
  </div>
  <div class="ritual-messages">
    <div class="ritual-msg sub" id="msg1">あなたの長年の思いは</div>
    <div class="ritual-msg sub" id="msg2">宇宙に溶けていった。</div>
    <div class="ritual-msg main" id="msg3">もう自分を許す時が来たのだ。</div>
    <div class="ritual-msg sub" id="msg4">古き重きを手放し</div>
    <div class="ritual-msg sub" id="msg5">あらたな人生を歩むのだ</div>
    <div style="height:180px"></div>
  </div>
  <button class="ritual-hint" id="ritualBackBtn">✦ 浄化完了 — もどる ✦</button>
</div>
<div class="copy-feedback" id="copyFeedback">コピーしました</div>
<script>
const confessions=["実は3日お風呂入ってません","LINE返そうと思って2週間が経ちました","サプリだけで生きようとした時期がありました","元気なフリをしていました","本当はずっと疲れていました","ごめんね、と思いながら既読をつけませんでした","賞味期限を2週間すぎたものを食べました","やる気に満ちた月曜日が来たことは一度もありません","洗濯物を3日間干しっぱなしにしました","「すぐやります」と言って今もやっていません","深夜2時に本気で人生を考え直しました","財布を忘れて引き返したことを誰にも言っていません","ありがとうを言いそびれたままの人がいます","部屋を片付けるふりをして隠しました","今日も明日でいいやと思いました","お腹が空いていないのに食べ続けました","返信が来るのが怖くてスマホを裏返しました","泣いたことを誰にも言いませんでした","頑張っている姿を誰かに見てほしかったです","本当は助けてほしかったです","ずっと本当の自分を隠して生きていました","大切な人を傷つけたことを、まだ引きずっています","諦めた夢のことをまだ考えてしまいます","誰かのことを羨ましいと思ってしまいました","笑っている時も、心のどこかで泣いていました","弱い自分を許せないでいました","比べるのをやめられない自分がいます","本音を言ったら嫌われると思っていました","傷ついていないふりをしていたけど、実は深く傷ついていました","孤独だということを、誰にも言えませんでした","もっと愛されたかったです","怒っていないふりをしていましたが、怒っていました","悲しいのに悲しいと言えませんでした","自分を大事にすることが、ずっと苦手でした","失敗した夜のことを、何度も思い出してしまいます","誰かに「大丈夫？」と聞かれて「大丈夫」と答え続けました","頑張れると思っていたのに、限界が先にきました","ちゃんとした大人のふりをするのに疲れました","全部投げ出したいと思ったことが何度もあります","休んでもいいとわかっているのに、休めませんでした","誰かの言葉が、まだ頭から離れません","後悔したくないと言いながら、後悔しています","本当はもっとわがままを言いたかったです","無理していないふりをして、無理していました","「なんでもない」と言った日は、なんでもある日でした","素直になれなくて、大切なものを逃したかもしれません","謝れないまま時間が過ぎてしまいました","伝えたかった言葉を、結局伝えませんでした","優しくされると怖くなってしまいます","もっと素直でいたかったです","嫌いな人を好きなふりをしていました","本当は寂しかったです","心配させないために、明るくしていました","傷つけたことに気づいていなかったふりをしていました","いなくなりたいと思った夜がありました","宿題を「やった」と言ったことがありました（本当はやっていません）","健康診断の前日だけ健康的な生活をしました","電車で寝たふりをして席を譲りませんでした","誕生日おめでとうを1週間忘れていました","やる気スイッチを探して5年が経ちました"];
const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';const size=Math.random()*2+.5;s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--del:${Math.random()*4}s;--op:${.3+Math.random()*.7};`;starsEl.appendChild(s);}
let currentIdx=-1;
function pickConfession(animated){let idx;do{idx=Math.floor(Math.random()*confessions.length);}while(idx===currentIdx);currentIdx=idx;const el=document.getElementById('themeText');if(animated){el.style.opacity='0';setTimeout(()=>{el.textContent=confessions[idx];el.style.opacity='1';},300);}else{el.textContent=confessions[idx];}}
const hintToggleBtn=document.getElementById('hintToggleBtn');
const hintBox=document.getElementById('hintBox');
hintToggleBtn.addEventListener('click',()=>{const isOpen=hintBox.classList.toggle('open');hintToggleBtn.textContent=isOpen?'✕ 閉じる':'ヒントをもらう';if(isOpen&&!hintBox.dataset.loaded){pickConfession(false);hintBox.dataset.loaded='1';}});
document.getElementById('shuffleBtn').addEventListener('click',()=>pickConfession(true));
const writeBox=document.getElementById('confessionText');
writeBox.addEventListener('input',()=>{writeBox.style.height='auto';writeBox.style.height=writeBox.scrollHeight+'px';});
const canvas=document.getElementById('smokeCanvas');
const ctx=canvas.getContext('2d');
let particles=[],rafId=null,isRunning=false;
function addParticle(){particles.push({x:80+(Math.random()-.5)*4,y:170,vx:(Math.random()-.5)*.6,vy:-(1.0+Math.random()*1.0),r:3+Math.random()*4,life:1,decay:.005+Math.random()*.003,angle:Math.random()*Math.PI*2,angleSpeed:(Math.random()-.5)*.05});}
function drawFrame(){ctx.clearRect(0,0,160,180);if(isRunning&&Math.random()<.3)addParticle();particles=particles.filter(p=>p.life>0);for(const p of particles){p.angle+=p.angleSpeed;p.x+=p.vx+Math.sin(p.angle)*.5;p.y+=p.vy;p.r+=.12;p.life-=p.decay;const a=Math.max(0,p.life)*.4;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(210,200,225,${a})`);g.addColorStop(.6,`rgba(160,150,180,${a*.4})`);g.addColorStop(1,`rgba(80,70,100,0)`);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}if(particles.length>0||isRunning){rafId=requestAnimationFrame(drawFrame);}else{rafId=null;}}
function startSmoke(){isRunning=true;particles=[];if(!rafId)drawFrame();}
function stopSmoke(){isRunning=false;}
document.getElementById('purifyBtn').addEventListener('click',()=>{
  const text=writeBox.value.trim();
  if(!text&&!confirm('懺悔を書かずに浄化しますか？'))return;
  beginPurification(text);
});

function beginPurification(confText){
  // Step 1: scroll to top so candle is visible
  window.scrollTo({top:0,behavior:'smooth'});
  setupSNS(confText);

  // Step 2: after scroll, show candle burning for a moment, then transition
  setTimeout(()=>{
    // fade out the page content gently then show overlay
    const overlay=document.getElementById('ritualOverlay');
    ['msg1','msg2','msg3','msg4','msg5'].forEach(id=>document.getElementById(id).classList.remove('show'));
    overlay.classList.add('active');

    // Step 3: reset ember animation by replacing the element
    const ember = overlay.querySelector('[style*="emberdie"]');
    if(ember){ ember.style.animation='none'; void ember.offsetWidth; ember.style.animation=''; }

    // smoke starts (candle just went out)
    startSmoke();

    // Step 4: messages appear
    [1400,2200,3200,4400,5400].forEach((ms,i)=>{
      setTimeout(()=>document.getElementById('msg'+(i+1)).classList.add('show'),ms);
    });
  }, 1800); // wait 1.8s watching the candle
}

document.getElementById('ritualBackBtn').addEventListener('click',(e)=>{e.stopPropagation();
  const overlay=document.getElementById('ritualOverlay');
  const sns=document.getElementById('snsSection');
  stopSmoke();
  overlay.classList.remove('active');
  sns.classList.add('visible');
  setTimeout(()=>{
    window.scrollTo({top:document.getElementById('snsSection').offsetTop-20,behavior:'smooth'});
  },750);
});
function setupSNS(text){const snsText=`【懺悔】\n${text?text+'\n':''}\n#ZANGE #懺悔`;document.getElementById('snsPreview').textContent=snsText;const enc=encodeURIComponent(snsText);document.getElementById('shareX').href=`https://twitter.com/intent/tweet?text=${enc}`;document.getElementById('shareThreads').href=`https://www.threads.net/intent/post?text=${enc}`;document.getElementById('shareLine').href=`https://line.me/R/msg/text/?${enc}`;}
document.getElementById('copyBtn').addEventListener('click',()=>{navigator.clipboard.writeText(document.getElementById('snsPreview').textContent).then(()=>{const fb=document.getElementById('copyFeedback');fb.classList.add('show');setTimeout(()=>fb.classList.remove('show'),2200);});});
document.getElementById('resetBtn').addEventListener('click',()=>{writeBox.value='';writeBox.style.height='';document.getElementById('charHint').textContent='匿名 · 誰にも届かない';document.getElementById('snsSection').classList.remove('visible');hintBox.classList.remove('open');delete hintBox.dataset.loaded;hintToggleBtn.textContent='ヒントをもらう';['msg1','msg2','msg3','msg4','msg5'].forEach(id=>document.getElementById(id).classList.remove('show'));window.scrollTo({top:0,behavior:'smooth'});});
</script>
</body>
